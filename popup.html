<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortlinks Skipper</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e3e6eb;
      --accent: #4f46e5;
      --accent-press: #4338ca;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      width: 330px;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .logo {
      width: 30px; height: 30px; border-radius: 8px; display: block;
      box-shadow: 0 2px 6px rgba(79, 70, 229, .35);
    }
    .brand h1 { font-size: 14px; margin: 0; line-height: 1.1; }
    .brand small { color: var(--muted); font-size: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 11px;
      margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row + .row { margin-top: 6px; }
    .label { font-weight: 600; font-size: 12px; }
    .hint { color: var(--muted); font-size: 11px; }
    .host { font-weight: 600; font-size: 12.5px; word-break: break-all; }
    .pill {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: #eef0f4; color: var(--muted); white-space: nowrap;
    }
    .pill.on { background: #e7f6ec; color: var(--ok); }
    .pill.off { background: #fdeaea; color: var(--danger); }
    textarea {
      width: 100%; margin-top: 7px; resize: vertical;
      border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 8px; font-size: 12px; font-family: inherit;
      background: #fbfbfd; color: var(--text);
    }
    textarea:focus { outline: 2px solid #c7c9f7; border-color: var(--accent); }
    .actions { display: flex; gap: 7px; margin-top: 9px; }
    button {
      font: inherit; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 10px; cursor: pointer;
      background: #fff; color: var(--text);
      transition: background .15s, border-color .15s;
    }
    button:hover { background: #f2f3f7; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-press); }
    button.small { padding: 5px 8px; font-size: 11px; }
    footer { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    #status { color: var(--ok); font-size: 11px; font-weight: 600; }

    /* toggle switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #cbd5e1; border-radius: 999px; transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: transform .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    details summary { cursor: pointer; font-weight: 600; font-size: 12px; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸"; display: inline-block; margin-right: 6px; color: var(--muted); transition: transform .15s; }
    details[open] summary::before { transform: rotate(90deg); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="icons/icon48.png" alt="" width="30" height="30">
      <div>
        <h1>Shortlinks Skipper</h1>
        <small>Skip shortlinks automatically</small>
      </div>
    </div>
    <label class="switch" title="Enable / disable">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="card">
    <div class="row">
      <span class="host" id="site-host">Checking current tab…</span>
      <span class="pill" id="site-state"></span>
    </div>
    <div class="actions">
      <button class="small" id="btn-resume">Always skip here</button>
      <button class="small" id="btn-pause">Never skip here</button>
    </div>
  </section>

  <details class="card" open>
    <summary>Whitelist</summary>
    <div class="hint">If this list is not empty, the extension runs <em>only</em> on these domains.</div>
    <textarea id="whitelist" rows="3" placeholder="example.com&#10;sub.example.org" spellcheck="false"></textarea>
  </details>

  <details class="card" open>
    <summary>Blacklist</summary>
    <div class="hint">The extension will never run on these domains.</div>
    <textarea id="blacklist" rows="3" placeholder="ads.example.com" spellcheck="false"></textarea>
  </details>

  <footer>
    <button class="primary" id="save">Save</button>
    <span id="status"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
